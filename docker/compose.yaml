name: free-router
services:
  free-router:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: free-router
    restart: unless-stopped
    # No env_file / environment: all settings come from data/.env (first
    # boot seed only; the published port requires FREE_ROUTER_HOST=0.0.0.0,
    # FREE_ROUTER_WEBUI_PASSWORD and FREE_ROUTER_API_KEY (a wide bind refuses
    # to start without a non-default password and a gateway key), config.local.json
    # in data/ (operator writes, authoritative afterwards), and
    # app/config/config.json (tracked defaults). Explicit `docker compose
    # run -e ...` still wins for one-off overrides. NOTE: the published port
    # cannot reach a fresh container that still binds 127.0.0.1; seed
    # these values in data/.env before the first boot.
    ports:
      # Published on all host interfaces; the server inside still binds what
      # data/.env (first boot) or the overlay says (127.0.0.1 by default).
      - "8787:8787"
    volumes:
      # The only writable dir: overlay config, discovery state, .env, logs.
      # Everything else in the image is read-only code and defaults.
      - ../data:/srv/free-router/data
    # Bound the container log: one request line per attempt adds up, and an
    # unbounded json-file log can fill the host disk. Docker rotates these
    # files itself, so no logrotate config is needed.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The server drains in-flight requests for up to 8 s on SIGTERM; Docker's
    # default 10 s stop timeout covers that, with SIGKILL as the fallback.
    stop_grace_period: 12s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
