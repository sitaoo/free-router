name: free-router
services:
  free-router:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: free-router
    restart: unless-stopped
    # No env_file / environment: all settings come from data/.env (first
    # boot seed only, e.g. FREE_ROUTER_HOST=0.0.0.0 for LAN), config.local.json
    # in data/ (operator writes, authoritative afterwards), and
    # app/config/config.json (tracked defaults). Explicit `docker compose
    # run -e ...` still wins for one-off overrides. NOTE: a fresh container
    # binds 127.0.0.1 until data/.env or the UI sets a host.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # The only writable dir: overlay config, discovery state, .env, logs.
      # Everything else in the image is read-only code and defaults.
      - ../data:/srv/free-router/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
